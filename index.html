<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shift // terminal os</title>
    <style>
        html, body { 
            background-color: #ffffff; 
            color: #000000; 
            font-family: 'courier new', courier, monospace; 
            font-size: 16px; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }
        .fullscreen-terminal { 
            width: 100%; 
            height: 100vh; 
            padding: 25px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
        }
        .prompt-form { 
            display: flex; 
            align-items: center; 
            width: 100%; 
            margin-top: 10px; 
        }
        .prompt-user { 
            color: #0055ff; 
            font-weight: bold; 
            margin-right: 10px; 
            white-space: nowrap; 
        }
        .terminal-input { 
            background: transparent; 
            border: none; 
            color: #000000; 
            font-family: 'courier new', courier, monospace; 
            font-size: 16px; 
            outline: none; 
            flex: 1; 
            padding: 0; 
            margin: 0; 
        }
        /* Macht die Zeichen bei der Passworteingabe unsichtbar */
        .mask-active { 
            color: transparent !important; 
            text-shadow: 0 0 0 transparent !important; 
            caret-color: #000000; 
        }
        .editor-bar-top { 
            background-color: #000000; 
            color: #ffffff; 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 12px; 
            font-weight: bold; 
            font-size: 14px; 
            letter-spacing: 1px; 
        }
        .editor-content-body { 
            flex: 1; 
            padding: 20px 5px; 
            overflow-y: auto; 
            color: #000000; 
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>

    <div class="fullscreen-terminal">
        <div class="editor-bar-top">
            <span>SHIFT // TERMINAL OS</span>
            <span>v1.0.0</span>
        </div>
        
        <div id="terminal-content" class="editor-content-body">Bitte gib das System-Passwort ein, um fortzufahren.</div>

        <form class="prompt-form" id="terminal-form">
            <span class="prompt-user" id="prompt-label">passwort:~$</span>
            <!-- Startet mit der Maskierungsklasse für das Passwort -->
            <input type="text" class="terminal-input mask-active" id="terminal-input" autofocus required autocomplete="off">
        </form>
    </div>

    <script>
        // --- KONFIGURATION ---
        const ZIEL_EMAIL = "deine-email@beispiel.de"; // Trage hier deine E-Mail-Adresse ein
        const SYSTEM_PASSWORT = "geheim123";          // Trage hier das gewünschte Passwort ein

        // Variablen für den Zustand
        let aktuellerSchritt = "PASSWORT"; // Mögliche Zustände: PASSWORT, EMAIL, NACHRICHT, FERTIG
        let gespeicherteEmail = "";

        const form = document.getElementById('terminal-form');
        const input = document.getElementById('terminal-input');
        const content = document.getElementById('terminal-content');
        const label = document.getElementById('prompt-label');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const eingabe = input.value.trim();
            if (!eingabe) return;

            if (aktuellerSchritt === "PASSWORT") {
                if (eingabe === SYSTEM_PASSWORT) {
                    // Wechsel zu Schritt 2: E-Mail abfragen
                    aktuellerSchritt = "EMAIL";
                    input.value = "";
                    input.classList.remove('mask-active'); // Text wieder sichtbar machen
                    label.textContent = "e-mail:~$";
                    content.innerHTML = "Zugriff gewährt.\n\nBitte gib deine E-Mail-Adresse an, damit wir dich kontaktieren können.";
                } else {
                    content.innerHTML = "Falsches Passwort. Zugriff verweigert.\nBitte versuche es erneut:";
                    input.value = "";
                }
            } 
            
            else if (aktuellerSchritt === "EMAIL") {
                // Einfache Validierung, ob ein @-Zeichen vorhanden ist
                if (eingabe.includes("@")) {
                    gespeicherteEmail = eingabe;
                    
                    // Wechsel zu Schritt 3: Nachricht abfragen
                    aktuellerSchritt = "NACHRICHT";
                    input.value = "";
                    label.textContent = "nachricht:~$";
                    content.innerHTML = `E-Mail registriert: ${gespeicherteEmail}\n\nDu kannst nun unten deine Nachricht eingeben. Drücke Enter zum Absenden.`;
                } else {
                    content.innerHTML = "Ungültige E-Mail-Adresse.\nBitte gib eine korrekte Adresse ein:";
                    input.value = "";
                }
            } 
            
            else if (aktuellerSchritt === "NACHRICHT") {
                input.disabled = true;
                content.innerHTML = "[System]: Übertrage Daten...";

                // Daten per FormSubmit API versenden
                fetch(`https://formsubmit.co{ZIEL_EMAIL}`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        Betreff: "Neue Terminal-Nachricht",
                        Absender: gespeicherteEmail,
                        Nachricht: eingabe
                    })
                })
                .then(response => {
                    if (response.ok) {
                        aktuellerSchritt = "FERTIG";
                        content.innerHTML = "--- SYSTEM-NACHRICHT ERFOLGREICH ÜBERMITTELT ---\n\nDeine Nachricht wurde gesendet.\nWir melden uns unter: " + gespeicherteEmail;
                        form.style.display = "none"; // Blendet die Eingabezeile am Ende komplett aus
                    } else {
                        content.innerHTML = "[Fehler]: Senden fehlgeschlagen. Bitte versuche es noch einmal.\n\nNachricht:";
                        input.disabled = false;
                        input.focus();
                    }
                })
                .catch(error => {
                    content.innerHTML = "[Fehler]: Verbindung fehlgeschlagen.\n\nNachricht:";
                    input.disabled = false;
                    input.focus();
                });
            }
        });
    </script>

</body>
</html>
