<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shift // terminal os</title>
    <style>
        html, body { 
            background-color: #ffffff; 
            color: #000000; 
            font-family: 'courier new', courier, monospace; 
            font-size: 16px; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }
        .fullscreen-terminal { 
            width: 100%; 
            height: 100vh; 
            padding: 25px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
        }
        .editor-bar-top { 
            background-color: #000000; 
            color: #ffffff; 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 12px; 
            font-weight: bold; 
            font-size: 14px; 
            letter-spacing: 1px; 
        }
        .editor-content-body { 
            flex: 1; 
            padding: 20px 5px; 
            overflow-y: auto; 
            color: #000000; 
            white-space: pre-wrap; 
        }
        .prompt-form { 
            display: flex; 
            align-items: center; 
            width: 100%; 
            margin-top: 10px; 
        }
        .prompt-user { 
            color: #0055ff; 
            font-weight: bold; 
            margin-right: 10px; 
            white-space: nowrap; 
        }
        .next-btn {
            background: #000000;
            color: #ffffff;
            border: none;
            font-family: 'courier new', courier, monospace;
            padding: 4px 10px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="fullscreen-terminal">
        <div class="editor-bar-top">
            <span>SHIFT // TERMINAL OS</span>
            <span>v1.0.0</span>
        </div>
        
        <div class="editor-content-body">--- PROTOKOLL ERFOLGREICH ÜBERMITTELT ---<br><br>Deine Logdaten und die Nachricht wurden fehlerfrei verarbeitet.<br><br>Das Terminal wird zurückgesetzt.</div>
        
        <div class="prompt-form">
            <span class="prompt-user">system:~$</span>
            <a href="/" class="next-btn">[NEUSTART]</a>
        </div>
    </div>

</body>
</html>
